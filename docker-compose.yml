services:
  # Must NOT be named "app" — that alias collides with gematrior on deploy_gematrior
  diamonds:
    build: .
    image: diamonds-prod:latest
    container_name: diamonds-prod-app
    restart: unless-stopped
    environment:
      PORT: "8501"
    networks:
      - edge

networks:
  edge:
    external: true
    name: deploy_gematrior
