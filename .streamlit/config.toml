# Light base: in-app Light/Dark still overrides via parent CSS.
# Dark base left navy steppers + invisible form buttons in light mode.

[theme]
base = "light"
primaryColor = "#3d7eb0"
backgroundColor = "#e8f2fc"
secondaryBackgroundColor = "#ffffff"
textColor = "#0c1a2e"
font = "sans serif"

[server]
enableCORS = false
enableXsrfProtection = true
headless = true

[browser]
gatherUsageStats = false

[runner]
magicEnabled = true
fastReruns = true

[client]
showErrorDetails = true
toolbarMode = "minimal"
