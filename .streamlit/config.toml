# Dark base keeps Streamlit widgets readable if custom CSS inject is delayed.

[theme]
base = "dark"
primaryColor = "#7eb8e8"
backgroundColor = "#070b14"
secondaryBackgroundColor = "#152238"
textColor = "#e8f0fa"
font = "sans serif"

[server]
enableCORS = false
enableXsrfProtection = true
headless = true

[browser]
gatherUsageStats = false

[runner]
magicEnabled = true
fastReruns = true

[client]
showErrorDetails = true
toolbarMode = "minimal"
